<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!-- Decorative border frame with maroon theme -->
  <defs>
    <linearGradient id="blueGradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9BFBF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#B98D8D;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="goldGradBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4A17E;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#D2A87E;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Elegant border frame -->
  <rect x="50" y="50" width="1100" height="700" rx="20" stroke="url(#goldGradBorder)" stroke-width="3" fill="none"/>
  <rect x="60" y="60" width="1080" height="680" rx="15" stroke="url(#blueGradBorder)" stroke-width="2" fill="none"/>
  
  <!-- Corner decorations - Top Left -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="30" fill="#D9BFBF" opacity="0.3"/>
    <circle cx="100" cy="100" r="20" fill="#B98D8D" opacity="0.2"/>
    <path d="M 70 100 Q 100 70, 130 100" stroke="#C4A17E" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Corner decorations - Top Right -->
  <g opacity="0.6">
    <circle cx="1100" cy="100" r="30" fill="#D9BFBF" opacity="0.3"/>
    <circle cx="1100" cy="100" r="20" fill="#B98D8D" opacity="0.2"/>
    <path d="M 1070 100 Q 1100 70, 1130 100" stroke="#C4A17E" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Corner decorations - Bottom Left -->
  <g opacity="0.6">
    <circle cx="100" cy="700" r="30" fill="#D9BFBF" opacity="0.3"/>
    <circle cx="100" cy="700" r="20" fill="#B98D8D" opacity="0.2"/>
    <path d="M 70 700 Q 100 730, 130 700" stroke="#C4A17E" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Corner decorations - Bottom Right -->
  <g opacity="0.6">
    <circle cx="1100" cy="700" r="30" fill="#D9BFBF" opacity="0.3"/>
    <circle cx="1100" cy="700" r="20" fill="#B98D8D" opacity="0.2"/>
    <path d="M 1070 700 Q 1100 730, 1130 700" stroke="#C4A17E" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Delicate floral elements scattered -->
  <g opacity="0.4">
    <!-- Top -->
    <circle cx="600" cy="80" r="8" fill="#D9BFBF"/>
    <circle cx="590" cy="75" r="5" fill="#C4A17E"/>
    <circle cx="610" cy="75" r="5" fill="#C4A17E"/>
    
    <!-- Bottom -->
    <circle cx="600" cy="720" r="8" fill="#D9BFBF"/>
    <circle cx="590" cy="725" r="5" fill="#C4A17E"/>
    <circle cx="610" cy="725" r="5" fill="#C4A17E"/>
    
    <!-- Left -->
    <circle cx="80" cy="400" r="8" fill="#D9BFBF"/>
    <circle cx="75" cy="390" r="5" fill="#C4A17E"/>
    <circle cx="75" cy="410" r="5" fill="#C4A17E"/>
    
    <!-- Right -->
    <circle cx="1120" cy="400" r="8" fill="#D9BFBF"/>
    <circle cx="1125" cy="390" r="5" fill="#C4A17E"/>
    <circle cx="1125" cy="410" r="5" fill="#C4A17E"/>
  </g>
</svg>
