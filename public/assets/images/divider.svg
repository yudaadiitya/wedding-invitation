<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" fill="none">
  <!-- Elegant divider/separator -->
  <defs>
    <linearGradient id="goldGradDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0" />
      <stop offset="25%" style="stop-color:#D4AF37;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#E8C468;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#D4AF37;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="blueGradDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9BB5CE;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#9BB5CE;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#7a9ab8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#9BB5CE;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#9BB5CE;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Main gold line with gradient -->
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#goldGradDiv)" stroke-width="2"/>
  
  <!-- Secondary blue line above -->
  <line x1="100" y1="25" x2="1100" y2="25" stroke="url(#blueGradDiv)" stroke-width="1" opacity="0.5"/>
  
  <!-- Secondary blue line below -->
  <line x1="100" y1="35" x2="1100" y2="35" stroke="url(#blueGradDiv)" stroke-width="1" opacity="0.5"/>
  
  <!-- Center ornament -->
  <g transform="translate(600, 30)">
    <!-- Diamond shape -->
    <path d="M 0,-8 L 6,0 L 0,8 L -6,0 Z" fill="#D4AF37" opacity="0.8"/>
    <path d="M 0,-6 L 4,0 L 0,6 L -4,0 Z" fill="#E8C468"/>
    
    <!-- Small circles on sides -->
    <circle cx="-20" cy="0" r="3" fill="#9BB5CE" opacity="0.6"/>
    <circle cx="20" cy="0" r="3" fill="#9BB5CE" opacity="0.6"/>
    
    <!-- Tiny accent dots -->
    <circle cx="-12" cy="0" r="1.5" fill="#D4AF37"/>
    <circle cx="12" cy="0" r="1.5" fill="#D4AF37"/>
  </g>
  
  <!-- Side ornaments left -->
  <g transform="translate(200, 30)">
    <circle cx="0" cy="0" r="4" fill="#9BB5CE" opacity="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#D4AF37" opacity="0.7"/>
  </g>
  
  <!-- Side ornaments right -->
  <g transform="translate(1000, 30)">
    <circle cx="0" cy="0" r="4" fill="#9BB5CE" opacity="0.5"/>
    <circle cx="0" cy="0" r="2" fill="#D4AF37" opacity="0.7"/>
  </g>
</svg>
