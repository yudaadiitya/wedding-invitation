<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Floral decoration with maroon rose blooms -->
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D9BFBF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B98D8D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C4A17E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2A87E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Large rose left -->
  <g opacity="0.8">
    <circle cx="120" cy="180" r="45" fill="url(#blueGrad)"/>
    <circle cx="110" cy="170" r="35" fill="#D9BFBF" opacity="0.7"/>
    <circle cx="120" cy="180" r="25" fill="#B98D8D" opacity="0.5"/>
    <circle cx="125" cy="175" r="15" fill="#996D6D" opacity="0.4"/>
  </g>
  
  <!-- Medium rose -->
  <g opacity="0.7">
    <circle cx="220" cy="240" r="35" fill="url(#blueGrad)"/>
    <circle cx="215" cy="235" r="25" fill="#D9BFBF" opacity="0.6"/>
    <circle cx="220" cy="240" r="18" fill="#B98D8D" opacity="0.4"/>
  </g>
  
  <!-- Small rose -->
  <g opacity="0.6">
    <circle cx="180" cy="140" r="25" fill="url(#blueGrad)"/>
    <circle cx="175" cy="135" r="18" fill="#D9BFBF" opacity="0.5"/>
    <circle cx="180" cy="140" r="12" fill="#B98D8D" opacity="0.3"/>
  </g>
  
  <!-- Eucalyptus leaves -->
  <ellipse cx="80" cy="120" rx="15" ry="30" fill="#C08C8C" opacity="0.5" transform="rotate(-25 80 120)"/>
  <ellipse cx="100" cy="110" rx="12" ry="25" fill="#C08C8C" opacity="0.4" transform="rotate(-15 100 110)"/>
  <ellipse cx="120" cy="105" rx="10" ry="20" fill="#C08C8C" opacity="0.3" transform="rotate(-5 120 105)"/>
  
  <ellipse cx="260" cy="200" rx="15" ry="30" fill="#C08C8C" opacity="0.5" transform="rotate(35 260 200)"/>
  <ellipse cx="240" cy="190" rx="12" ry="25" fill="#C08C8C" opacity="0.4" transform="rotate(25 240 190)"/>
  <ellipse cx="220" cy="180" rx="10" ry="20" fill="#C08C8C" opacity="0.3" transform="rotate(15 220 180)"/>
  
  <!-- Gold accent dots -->
  <circle cx="150" cy="160" r="4" fill="url(#goldGrad)"/>
  <circle cx="170" cy="190" r="3" fill="url(#goldGrad)"/>
  <circle cx="190" cy="210" r="5" fill="url(#goldGrad)"/>
  <circle cx="140" cy="210" r="3" fill="url(#goldGrad)"/>
  
  <!-- Decorative lines -->
  <path d="M 50 300 Q 150 280, 250 300" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 60 310 Q 150 295, 240 310" stroke="#D9BFBF" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
