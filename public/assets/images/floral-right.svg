<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Floral decoration (mirrored) with dusty blue roses -->
  <defs>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9BB5CE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a9ab8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8C468;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Large rose right (mirrored) -->
  <g opacity="0.8">
    <circle cx="680" cy="180" r="45" fill="url(#blueGrad2)"/>
    <circle cx="690" cy="170" r="35" fill="#9BB5CE" opacity="0.7"/>
    <circle cx="680" cy="180" r="25" fill="#7a9ab8" opacity="0.5"/>
    <circle cx="675" cy="175" r="15" fill="#5e7fa0" opacity="0.4"/>
  </g>
  
  <!-- Medium rose -->
  <g opacity="0.7">
    <circle cx="580" cy="240" r="35" fill="url(#blueGrad2)"/>
    <circle cx="585" cy="235" r="25" fill="#9BB5CE" opacity="0.6"/>
    <circle cx="580" cy="240" r="18" fill="#7a9ab8" opacity="0.4"/>
  </g>
  
  <!-- Small rose -->
  <g opacity="0.6">
    <circle cx="620" cy="140" r="25" fill="url(#blueGrad2)"/>
    <circle cx="625" cy="135" r="18" fill="#9BB5CE" opacity="0.5"/>
    <circle cx="620" cy="140" r="12" fill="#7a9ab8" opacity="0.3"/>
  </g>
  
  <!-- Eucalyptus leaves (mirrored) -->
  <ellipse cx="720" cy="120" rx="15" ry="30" fill="#88a68e" opacity="0.5" transform="rotate(25 720 120)"/>
  <ellipse cx="700" cy="110" rx="12" ry="25" fill="#88a68e" opacity="0.4" transform="rotate(15 700 110)"/>
  <ellipse cx="680" cy="105" rx="10" ry="20" fill="#88a68e" opacity="0.3" transform="rotate(5 680 105)"/>
  
  <ellipse cx="540" cy="200" rx="15" ry="30" fill="#88a68e" opacity="0.5" transform="rotate(-35 540 200)"/>
  <ellipse cx="560" cy="190" rx="12" ry="25" fill="#88a68e" opacity="0.4" transform="rotate(-25 560 190)"/>
  <ellipse cx="580" cy="180" rx="10" ry="20" fill="#88a68e" opacity="0.3" transform="rotate(-15 580 180)"/>
  
  <!-- Gold accent dots -->
  <circle cx="650" cy="160" r="4" fill="url(#goldGrad2)"/>
  <circle cx="630" cy="190" r="3" fill="url(#goldGrad2)"/>
  <circle cx="610" cy="210" r="5" fill="url(#goldGrad2)"/>
  <circle cx="660" cy="210" r="3" fill="url(#goldGrad2)"/>
  
  <!-- Decorative lines -->
  <path d="M 750 300 Q 650 280, 550 300" stroke="url(#goldGrad2)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 740 310 Q 650 295, 560 310" stroke="#9BB5CE" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
